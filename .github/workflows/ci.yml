name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: traceweave-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['20', '22', '24']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: ${{ matrix.node }}
      # No npm install anywhere below — the zero-runtime-dependency invariant
      # is proven by the CI itself running from a bare checkout.
      - name: hermetic selftest
        run: node packages/cli/bin/traceweave.mjs selftest
      - name: action selftest (fake GitHub env, loopback API)
        run: node packages/action/selftest.mjs
      - name: reconcile-action selftest (stateful fake PR API, bare git remote)
        run: node packages/reconcile-action/selftest.mjs
      - name: determinism snapshot (build twice + CRLF + committed demo)
        run: node scripts/determinism.mjs
      - name: zero runtime dependencies
        run: node scripts/check-zero-deps.mjs

  gate-demo:
    # Dogfood: the real action gating the committed demo repo (design §11).
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
      pull-requests: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
      - uses: ./packages/action
        with:
          config: examples/demo-repo/traceweave.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
