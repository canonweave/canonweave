# Release pipeline (design §10): tag -> tested, provenance-attested npm
# publish + GitHub release + action major-tag move. Trigger: push a signed
# tag `vX.Y.Z` (see docs/releasing.md).
#
# Requires the NPM_TOKEN repo secret (npm automation token with publish
# rights on the `traceweave` package / @traceweave scope). npm --provenance
# generates the SLSA provenance statement, verifiable via `npm audit signatures`.
name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write   # GitHub release + moving the action major tag
  id-token: write   # npm provenance (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
      - name: guard - NPM_TOKEN present
        run: |
          if [ -z "${{ secrets.NPM_TOKEN }}" ]; then
            echo "::error title=release blocked::NPM_TOKEN repo secret is not set — create an npm automation token with publish rights and add it (docs/releasing.md)."
            exit 1
          fi
      - name: full test suite (no install)
        run: npm test
      - name: assemble npm artifact
        run: node scripts/pack-npm.mjs
      - name: version must match the tag
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG=$(node -p "JSON.parse(require('fs').readFileSync('dist-npm/package.json','utf8')).version")
          if [ "$TAG" != "$PKG" ]; then
            echo "::error title=version mismatch::tag v$TAG but package version $PKG — bump package versions first."
            exit 1
          fi
      - name: publish with provenance
        working-directory: dist-npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag \
            --notes-file <(printf 'Pinned action ref for this release:\n\n    uses: traceweavehq/traceweave/packages/action@%s\n' "$GITHUB_SHA")
      - name: move action major tag (v1) on stable releases
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          git config user.name "traceweave-release"
          git config user.email "release@users.noreply.github.com"
          git tag -f v1 "$GITHUB_SHA"
          git push -f origin v1
